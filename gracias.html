        *{box-sizing:border-box;margin:0;padding:0}

        .btn-p:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(0,229,255,.4)}
        .btn-s{display:inline-flex;align-items:center;gap:8px;background:#25d366;color:white;padding:13px 26px;border-radius:10px;font-weight:700;font-size:.9rem;text-decoration:none;transition:all .25s}
        .btn-s:hover{background:#20b858}
        @media(max-width:480px){.card{padding:40px 24px}}
